name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ci-checks:
    name: CI Checks
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: CI Checks | Checkout repository
        uses: actions/checkout@v4

      - name: CI Checks | Read version from _config.yml
        id: version
        run: |
          VERSION=$(grep -E '^version:' _config.yml | head -1 | sed -E 's/^version:[[:space:]]*//; s/["'\'']//g; s/[[:space:]]+$//')
          if [ -z "$VERSION" ]; then
            echo "version not found in _config.yml" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: CI Checks | Validate version format (X.Y.Z)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version '$TAG' in _config.yml, expected X.Y.Z" >&2
            exit 1
          fi

      - name: CI Checks | Lint YAML (config and workflows)
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint.yml _config.yml .github/workflows

      - name: CI Checks | Validate post front matter and image references
        run: python3 .github/scripts/check_site.py

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Build | Checkout repository
        uses: actions/checkout@v4

      - name: Build | Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build | Build Jekyll site
        run: bundle exec jekyll build

      - name: Build | Verify generated output (index, feed, sitemap)
        run: |
          for f in index.html feed.xml sitemap.xml 404.html; do
            test -s "_site/$f" || { echo "Missing or empty _site/$f" >&2; exit 1; }
          done

  release:
    name: Release
    needs: [ci-checks, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Release | Checkout repository
        uses: actions/checkout@v4

      - name: Release | Create tag and GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ci-checks.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
